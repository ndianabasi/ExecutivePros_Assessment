services:
  docs:
    build:
      context: .
      dockerfile: services/api-docs/Dockerfile
    image: executivepros-api-docs:0.1.0
    init: true
    restart: unless-stopped
    environment:
      API_ORIGIN: ${API_PUBLIC_ORIGIN:-http://127.0.0.1:18083}
    ports:
      - "127.0.0.1:18081:8080"
    networks:
      - assessment
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10004:10004"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/health/ready
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
  queue:
    build:
      context: .
      dockerfile: services/queue/Dockerfile
    image: executivepros-queue:0.1.0
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      JOBS_DB_PATH: /data/jobs.db
      QUEUE_SERVICE_SECRET_FILE: /run/secrets/queue_service_secret
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: ${SMTP_FROM:-notifications@example.test}
      EMAIL_WORKER_CONCURRENCY: "2"
      EMAIL_MAX_ATTEMPTS: "3"
      EMAIL_RETRY_INITIAL_MS: "5000"
      SMTP_TIMEOUT_MS: "10000"
      EMAIL_JOB_TIMEOUT_MS: "20000"
      EMAIL_LEASE_MS: "30000"
      EMAIL_POLL_MS: "1000"
    secrets:
      - queue_service_secret
    volumes:
      - type: volume
        source: assessment_data
        target: /data
        volume:
          subpath: queue
          nocopy: true
    networks:
      - assessment
    depends_on:
      mailpit:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10002:10002"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
  provider:
    build:
      context: .
      dockerfile: services/provider/Dockerfile
    image: executivepros-provider:0.1.0
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      PROVIDER_DB_PATH: /data/payment_provider.db
      PROVIDER_PUBLIC_ORIGIN: http://127.0.0.1:18082
      FRONTEND_ORIGIN: http://127.0.0.1:18080
      API_WEBHOOK_URL: http://api:3000/v1/webhooks/payment
      PROVIDER_SERVICE_SECRET_FILE: /run/secrets/provider_service_secret
      PROVIDER_WEBHOOK_SECRET_FILE: /run/secrets/provider_webhook_secret
      PROVIDER_WORKER_CONCURRENCY: "2"
      WEBHOOK_MAX_ATTEMPTS: "5"
      WEBHOOK_RETRY_INITIAL_MS: "2000"
      WEBHOOK_HTTP_TIMEOUT_MS: "5000"
      WEBHOOK_JOB_TIMEOUT_MS: "10000"
      WEBHOOK_LEASE_MS: "15000"
      WEBHOOK_POLL_MS: "250"
      WEBHOOK_SWEEP_INTERVAL_MS: "1000"
    ports:
      - "127.0.0.1:18082:3000"
    secrets:
      - provider_service_secret
      - provider_webhook_secret
    volumes:
      - type: volume
        source: assessment_data
        target: /data
        volume:
          subpath: provider
          nocopy: true
    networks:
      - assessment
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10003:10003"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: executivepros-api:0.1.0
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      API_DB_PATH: /data/api.db
      API_PUBLIC_ORIGIN: http://127.0.0.1:18083
      FRONTEND_ORIGIN: http://127.0.0.1:18080
      DOCS_ORIGIN: http://127.0.0.1:18081
      PROVIDER_BASE_URL: http://provider:3000
      PROVIDER_PUBLIC_ORIGIN: http://127.0.0.1:18082
      QUEUE_BASE_URL: http://queue:3000
      PROVIDER_WEBHOOK_SECRET_FILE: /run/secrets/provider_webhook_secret
      PROVIDER_SERVICE_SECRET_FILE: /run/secrets/provider_service_secret
      QUEUE_SERVICE_SECRET_FILE: /run/secrets/queue_service_secret
      QUEUE_TIMEOUT_MS: "5000"
      OUTBOX_INTERVAL_MS: "5000"
      OUTBOX_RETRY_INITIAL_MS: "1000"
      OUTBOX_RETRY_MAX_MS: "300000"
      RECONCILE_INTERVAL_MS: "60000"
      RECONCILE_GRACE_MS: "30000"
      PAYMENT_EXPIRY_DAYS: "30"
      JOB_BATCH_SIZE: "100"
      SSE_HEARTBEAT_MS: "15000"
    ports:
      - "127.0.0.1:18083:3000"
    secrets:
      - provider_webhook_secret
      - provider_service_secret
      - queue_service_secret
    volumes:
      - type: volume
        source: assessment_data
        target: /data
        volume:
          subpath: api
          nocopy: true
    networks:
      - assessment
    depends_on:
      provider:
        condition: service_healthy
      queue:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
  mailpit:
    build:
      context: ./services/mock-email
      dockerfile: Dockerfile
    image: executivepros-mailpit:v1.33.1
    init: true
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "0"
      MP_MAX_MESSAGE_SIZE: "1"
      MP_IGNORE_DUPLICATE_IDS: "false"
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_SMTP_MAX_RECIPIENTS: "1"
      MP_UI_BIND_ADDR: 0.0.0.0:8025
      MP_ALLOWED_HOSTS: mailpit
      MP_DISABLE_VERSION_CHECK: "true"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
      MP_ENABLE_CHAOS: "false"
    ports:
      - "127.0.0.1:18025:8025"
    volumes:
      - mailpit_data:/data
    networks:
      - assessment
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8025/livez && wget -q -O /dev/null http://127.0.0.1:8025/readyz
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

networks:
  assessment:
    driver: bridge

volumes:
  assessment_data:
  mailpit_data:

secrets:
  queue_service_secret:
    file: ./.local/secrets/queue_service_secret
  provider_service_secret:
    file: ./.local/secrets/provider_service_secret
  provider_webhook_secret:
    file: ./.local/secrets/provider_webhook_secret
