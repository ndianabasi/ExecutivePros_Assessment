services:
  queue:
    build:
      context: .
      dockerfile: services/queue/Dockerfile
    image: executivepros-queue:0.1.0
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      JOBS_DB_PATH: /data/jobs.db
      QUEUE_SERVICE_SECRET_FILE: /run/secrets/queue_service_secret
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: ${SMTP_FROM:-notifications@example.test}
      EMAIL_WORKER_CONCURRENCY: "2"
      EMAIL_MAX_ATTEMPTS: "3"
      EMAIL_RETRY_INITIAL_MS: "5000"
      SMTP_TIMEOUT_MS: "10000"
      EMAIL_JOB_TIMEOUT_MS: "20000"
      EMAIL_LEASE_MS: "30000"
      EMAIL_POLL_MS: "1000"
    secrets:
      - queue_service_secret
    volumes:
      - type: volume
        source: assessment_data
        target: /data
        volume:
          subpath: queue
          nocopy: true
    networks:
      - assessment
    depends_on:
      mailpit:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10002:10002"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
  mailpit:
    build:
      context: ./services/mock-email
      dockerfile: Dockerfile
    image: executivepros-mailpit:v1.33.1
    init: true
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "0"
      MP_MAX_MESSAGE_SIZE: "1"
      MP_IGNORE_DUPLICATE_IDS: "false"
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_SMTP_MAX_RECIPIENTS: "1"
      MP_UI_BIND_ADDR: 0.0.0.0:8025
      MP_ALLOWED_HOSTS: mailpit
      MP_DISABLE_VERSION_CHECK: "true"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
      MP_ENABLE_CHAOS: "false"
    ports:
      - "127.0.0.1:18025:8025"
    volumes:
      - mailpit_data:/data
    networks:
      - assessment
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8025/livez && wget -q -O /dev/null http://127.0.0.1:8025/readyz
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

networks:
  assessment:
    driver: bridge

volumes:
  assessment_data:
  mailpit_data:

secrets:
  queue_service_secret:
    file: ./.local/secrets/queue_service_secret
